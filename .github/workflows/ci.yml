name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  WHISPER_WER_THRESHOLD: "0.45"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Backend unit tests
        run: npm test
        working-directory: backend

  docker-and-trivy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: transcode-worker
            context: ./backend/workers/transcode-worker
          - name: transcribe-worker
            context: ./backend/workers/transcribe-worker
          - name: summarize-worker
            context: ./backend/workers/summarize-worker
          - name: whisper-service
            context: ./backend/workers/whisper-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag lectureflow/${{ matrix.name }}:ci ${{ matrix.context }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lectureflow/${{ matrix.name }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  whisper-quality:
    runs-on: ubuntu-latest
    needs: docker-and-trivy
    steps:
      - uses: actions/checkout@v4
      - name: Build Whisper image
        run: docker build --tag lectureflow/whisper-service:ci ./backend/workers/whisper-service
      - name: Start Whisper service
        run: >-
          docker run --detach --name whisper-service --publish 8000:8000
          --volume "$PWD/tests/audio:/media:ro" lectureflow/whisper-service:ci
      - name: Install quality test dependencies
        run: python -m pip install requests jiwer
      - name: Run WER quality test
        run: python tests/transcription_quality.py
      - name: Show Whisper logs on failure
        if: failure()
        run: docker logs whisper-service
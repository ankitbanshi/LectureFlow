services:
 
  db:
    image: mysql:8.0
    container_name: chunk_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chunk_redis
    restart: always
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
      
  backend:
    build: ./backend
    container_name: chunk_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
      - "${API_METRICS_PORT:-3003}:3002"
    environment:
  
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: ${BACKEND_PORT}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backend/temp:/app/temp
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  transcode-worker:
    build: ./backend/workers/transcode-worker
    container_name: chunk_transcode_worker
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOADS_DIR: /uploads
      MEDIA_DIR: /media
      METRICS_PORT: 9101
    volumes:
      - ./backend/uploads:/uploads
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - app_network
    expose:
      - "9101"

  whisper-service:
    build: ./backend/workers/whisper-service
    container_name: chunk_whisper_service
    restart: always
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      MEDIA_DIR: /media
    volumes:
      - media_data:/media
      - whisper_models:/root/.cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      - redis
    networks:
      - app_network

  transcribe-worker:
    build: ./backend/workers/transcribe-worker
    container_name: chunk_transcribe_worker
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOADS_DIR: /uploads
      MEDIA_DIR: /media
      WHISPER_URL: http://whisper-service:8000
      METRICS_PORT: 9102
    volumes:
      - ./backend/uploads:/uploads
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      whisper-service:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app_network
    expose:
      - "9102"

  summarize-worker:
    build: ./backend/workers/summarize-worker
    container_name: chunk_summarize_worker
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      METRICS_PORT: 9103
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - app_network
    expose:
      - "9103"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lectureflow_prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - transcode-worker
      - transcribe-worker
      - summarize-worker
    networks:
      - app_network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lectureflow_grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: chunk_frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:

      - VITE_BACKEND_URL=http://localhost:${BACKEND_PORT}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_network

volumes:
  mysql_data:
  redis_data:
  media_data:
  whisper_models:
  prometheus_data:
  grafana_data:

networks:
  app_network: